  <meta charset="UTF-8" />

    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <!-- JS SCRIPTS -->
  <script src="../js/global.js" defer></script>
  <script src="../js/app.js" defer></script>
  <script src="../js/health-bar.js" defer></script>
  <script src="../js/nav-bar.js" defer></script>
</head>

<body>

            <li class="hide-on-mobile"><a href="../index.html">Home</a></li>
            <li class="hide-on-mobile"><a href="./play-game.html">Play Game</a></li>
            <li class="hide-on-mobile"><a href="./high-score.html">High Scores</a></li>
            <li class="hide-on-mobile"><a href="./about-us.html">About Us</a></li>
            <li class="hide-on-desktop" onclick=showSidebar()><a href="#"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#5f6368"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg></a></li>
        </ul>
    </nav>
  </header>
<!-- END NAV BAR -->

  <main class="utility">

    <!-- Modal -->
    <section class="modal hidden">
      <div class="flex">
        <P>Welcome</P>
        <button type="button" class="btn-close">⨉</button>
      </div>
      <div id="interactive-modal-content"></div>
    </section>
    <div class="overlay hidden"></div>
    </div>
    <!-- End Modal -->

    <!-- Game Over Modal -->
    <section id="game-over-modal" class="modal" style="display: none;">
      <div>
        <h2>GAME OVER</h2>
        <p>Your dragon's health has reached zero.</p>
        <br>
        <button class="btn-submit" type="button" id="restart-game">Restart Game</button>
      </div>
    </section>
    <!-- End of Game Over Modal -->
    
    <!-- Dragon Containers -->
    <div class="game-container">
      <div class="dragon-details">
        <div class="dragon-animation-box">
          <div class="dragon-container">  
            <img class="dragon" src="../assets/dragons/bluedragon.png" alt="blue-dragon" />
          </div>
          <img class="lair" src="../assets/lairs/cave.png" alt="cave" />
          <h2 id="dynamic-dragon-name"></h2>
          <h2 id="score">Score: 0</h2>
        </div>
        <!-- End of dragon container -->
        
        <!-- Health bar -->
        <div class="health-bar-container" id="healthBar"></div>
        <!-- end of Health bar -->
      </div>
      
      <!-- Dragon Stats -->
      <div class="dragon-stats">
        <h2>Stats</h2>
        <div class="stats-grid">
          <div class="stat stat-hunger" id="hunger-stat">Hunger 10/10</div>
          <div class="stat stat-cleanliness" id="cleanliness-stat">Cleanliness 10/10</div>
          <div class="stat stat-happiness" id="happiness-stat">Happiness 10/10</div>
          <div class="stat stat-exercise" id="exercise-stat">Exercise 10/10</div>
        </div>
      </div>
      <!-- End of dragon stats -->
    </main>
    
    <!-- Game Actions -->
    <div class="game-actions utility">
      <button id="feed" type="button" aria-label="Feed the Dragon">Feed</button>
      <button id="clean" type="button" aria-label="Clean the Dragon's Cave">Clean</button>
      <button id="play" type="button" aria-label="Play with the Dragon">Play</button>
      <button id="pet" type="button" aria-label="Pet the Dragon">Pet</button>
    </div>
    <!-- end of game actions -->
    
  
</body>
<footer class="utility">
  <p>© 2024 Dragon Lair Industries</p>
</footer>
</html>
